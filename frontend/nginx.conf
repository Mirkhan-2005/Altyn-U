# При локальном HTTP cookies работают без Secure.
# В production Caddy передаёт X-Forwarded-Proto: https.
map $http_x_forwarded_proto $cookie_security_flag {
    default nosecure;
    https secure;
}

upstream altyn_backend {
    zone altyn_backend 64k;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 6m;

    # Проверка работоспособности Nginx.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django API и административная панель.
    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://altyn_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;

        # Проверенные заголовки приходят от Caddy.
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Убираем альтернативные заголовки определения HTTPS,
        # чтобы клиент не мог передать противоречивые значения.
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Ssl "";

        # Для внешнего HTTPS добавляем Secure к cookies Django.
        proxy_cookie_flags ~ $cookie_security_flag;

        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # Статика Django.
    location /static/ {
        alias /usr/share/nginx/static/;
    }

    # Пользовательские фотографии выдаются через защищённый API.
    location /media/ {
        return 404;
    }

    # Собранные JS и CSS React.
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}