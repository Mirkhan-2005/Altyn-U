# ==========================================
# Django backend
# ==========================================
upstream altyn_backend {
    zone altyn_backend 64k;

    # Встроенный DNS Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Позволяет обновлять адрес после пересоздания backend.
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 6m;

    # ==========================================
    # Проверка работоспособности Nginx
    # ==========================================
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ==========================================
    # Django API и административная панель
    # ==========================================
    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://altyn_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;

        # Эти заголовки устанавливает Caddy.
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # ==========================================
    # Django static, включая оформление admin
    # ==========================================
    location /static/ {
        alias /usr/share/nginx/static/;
    }

    # ==========================================
    # Пользовательские файлы
    # ==========================================
    # Фотографии выдаёт авторизованный API Django.
    location /media/ {
        return 404;
    }

    # ==========================================
    # Собранные JS и CSS React
    # ==========================================
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML должен обновляться при новом релизе.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ==========================================
    # React SPA
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}