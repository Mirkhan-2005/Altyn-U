upstream altyn_backend {
    zone altyn_backend 64k;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 6m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API и административная панель Django.
    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://altyn_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # Статика Django, включая оформление админки.
    location /static/ {
        alias /usr/share/nginx/static/;
    }

    # Фотографии студентов выдаёт защищённый API Django.
    location /media/ {
        return 404;
    }

    # Собранные JS и CSS React.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Позволяет открывать /login, /profile и другие страницы напрямую.
    location / {
        try_files $uri $uri/ /index.html;
    }
}