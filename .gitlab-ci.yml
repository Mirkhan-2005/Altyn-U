
# Altyn CI/CD: Build -> Deploy
stages:
  - build
  - deploy

# =====================================
# 1. BUILD — GitLab Runner
# =====================================
build:
  stage: build
  image: docker:28-cli

  tags:
    - saas-linux-small-amd64

  services:
    - name: docker:28-dind
      alias: docker
      command: ["--mtu=1400"]
      variables:
        HEALTHCHECK_TCP_PORT: "2375"

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  timeout: 30m

  script:
    - docker info

    # Вход в GitLab Container Registry
    - |
      printf '%s' "$CI_REGISTRY_PASSWORD" |
        docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    # Собираем Backend и Frontend
    - docker build --pull -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" ./backend
    - docker build --pull -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" ./frontend

    # Загружаем образы в GitLab
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"

    # Сохраняем версии образов для Deploy
    - |
      printf 'BACKEND_IMAGE=%s/backend:%s\nFRONTEND_IMAGE=%s/frontend:%s\n' \
        "$CI_REGISTRY_IMAGE" "$CI_COMMIT_SHA" \
        "$CI_REGISTRY_IMAGE" "$CI_COMMIT_SHA" > .release.env

  artifacts:
    paths:
      - .release.env
    expire_in: 7 days

# =====================================
# 2. DEPLOY — AWS EC2
# =====================================
deploy:
  stage: deploy
  image: alpine:3.21

  tags:
    - saas-linux-small-amd64

  needs:
    - job: build
      artifacts: true

  # Автоматически после успешного Build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

  resource_group: production
  interruptible: false
  timeout: 20m

  environment:
    name: production
    url: https://altyn.dpdns.org

  before_script:
    - apk add --no-cache openssh-client curl

  script:
    - |
      set -eu

      # Проверяем GitLab Variables
      : "${PROD_HOST:?Set PROD_HOST}"
      : "${PROD_USER:?Set PROD_USER}"
      : "${PROD_PATH:?Set PROD_PATH}"
      test -s "$SSH_PRIVATE_KEY"
      test -s "$SSH_KNOWN_HOSTS"
      printf '%s\n' "$PROD_PATH" | grep -Eq '^/[a-zA-Z0-9_/-]+$'
      chmod 600 "$SSH_PRIVATE_KEY"

      # SSH-подключение
      ssh_prod() {
        ssh -i "$SSH_PRIVATE_KEY" \
          -o IdentitiesOnly=yes -o BatchMode=yes \
          -o StrictHostKeyChecking=yes \
          -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS" \
          "$PROD_USER@$PROD_HOST" "$@"
      }

      # Копирование файлов
      scp_prod() {
        scp -i "$SSH_PRIVATE_KEY" \
          -o IdentitiesOnly=yes -o BatchMode=yes \
          -o StrictHostKeyChecking=yes \
          -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS" \
          "$@"
      }

      # Проверяем сервер и .env
      echo 'Checking AWS EC2...'
      ssh_prod "test -f '$PROD_PATH/.env' && docker info >/dev/null"

      # Копируем конфигурацию
      echo 'Copying files...'
      scp_prod docker-compose.yml Caddyfile .release.env \
        "$PROD_USER@$PROD_HOST:$PROD_PATH/"

      # Запускаем обновление на сервере
      echo 'Deploying Altyn...'
      ssh_prod "sh -se -- '$PROD_PATH'" <<'REMOTE'
      cd "$1"

      compose() {
        docker compose \
          --env-file .env \
          --env-file .release.env \
          -f docker-compose.yml "$@"
      }

      compose config --quiet
      compose pull
      compose up -d --wait --wait-timeout 120 db redis

      # Проверяем новые настройки Django
      compose run --rm --no-deps backend \
        python manage.py check --deploy --fail-level ERROR

      # Останавливаем старое приложение
      compose stop caddy frontend worker backend

      # Выполняем новые миграции через init
      compose rm -f init
      compose up -d --no-build --wait --wait-timeout 180

      compose ps -a
      REMOTE



    # Проверяем сайт и только после успеха очищаем старые образы
    - |
      echo 'Checking public website...'

      curl --fail --silent --show-error \
        --connect-timeout 10 --max-time 20 \
        --retry 5 --retry-delay 5 --retry-all-errors \
        https://altyn.dpdns.org/api/accounts/health/ || exit 1

      echo 'Cleaning unused Docker images on AWS EC2...'

      ssh_prod "docker image prune -a -f"

      echo 'Docker disk usage:'

      ssh_prod "docker system df"
